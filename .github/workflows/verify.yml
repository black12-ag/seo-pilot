name: Verify

on:
  push:
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test packaging and routing
        run: python3 -m unittest discover -s tests -v
      - name: Verify bundled source integrity
        run: python3 skills/seo-pilot/scripts/seo_pilot.py check
